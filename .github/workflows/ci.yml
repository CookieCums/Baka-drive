name: Baka Drive CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baka-drive-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, E2E, localization, native lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy

      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libwebkit2gtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci
        working-directory: app

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: app

      - name: Check repository security boundaries
        run: node scripts/check-app-security.cjs

      - name: Check E2E test policy
        run: node scripts/check-test-policy.cjs

      - name: Verify frontend and bundle budgets
        run: npm run build:verify
        working-directory: app

      - name: Validate localization catalogs
        run: npm run i18n:check
        working-directory: app

      - name: Run end-to-end tests
        run: npm test
        working-directory: app

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          if-no-files-found: ignore
          retention-days: 7

  desktop-build:
    name: Build desktop (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb,appimage
          - os: windows-2025
            bundle: nsis
          - os: macos-15
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libwebkit2gtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Verify frontend and bundle budgets
        run: npm run build:verify
        working-directory: app

      - name: Build native application bundles
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}
        working-directory: app

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baka-drive-desktop-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.AppImage
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.app/**
          if-no-files-found: error
          retention-days: 14

  android-debug:
    name: Android debug APK and emulator smoke
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools;emulator;platforms;android-35;build-tools;35.0.0;ndk;27.2.12479018'

      - name: Install Rust stable and Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Verify frontend and bundle budgets
        run: npm run build:verify
        working-directory: app

      - name: Initialize generated Android project
        run: npm run tauri -- android init
        working-directory: app

      - name: Prepare generated Android credential bridge
        run: node scripts/prepare-android-ci.cjs
        working-directory: app

      - name: Configure Android NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build unsigned debug APK
        run: npm run tauri -- android build --apk --debug
        working-directory: app

      - name: Verify APK artifact exists
        id: apk
        shell: bash
        run: |
          apk="$(find app/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -path '*androidTest*' | sort | head -n 1)"
          test -n "$apk" && test -s "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baka-drive-android-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Install and launch on Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash app/scripts/smoke-android-emulator.sh

      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baka-drive-android-emulator-evidence
          path: android-evidence/
          if-no-files-found: ignore
          retention-days: 7
